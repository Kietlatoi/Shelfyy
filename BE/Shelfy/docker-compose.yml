name: shelfy

services:
  db:
    image: postgres:16-alpine
    container_name: shelfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelfy_db}
      POSTGRES_USER: ${POSTGRES_USER:-shelfy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelfy_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - shelfy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shelfy_postgres_data:
