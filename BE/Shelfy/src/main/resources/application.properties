spring.application.name=Shelfy
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shelfy_db}
spring.datasource.username=${DB_USERNAME:shelfy}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiry=${JWT_ACCESS_EXPIRY:900000}
jwt.refresh-expiry=${JWT_REFRESH_EXPIRY:2592000000}
jwt.remember-me-refresh-expiry=${JWT_REMEMBER_ME_REFRESH_EXPIRY:7776000000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Weather API
weather.api-key=${WEATHER_API_KEY:}
weather.api-url=${WEATHER_API_URL:https://api.openweathermap.org/data/2.5}

# VNPay Sandbox
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${APP_BASE_URL:http://localhost:8080}/api/payments/vnpay/callback
vnpay.ipn-url=${APP_BASE_URL:http://localhost:8080}/api/payments/vnpay/ipn

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Logging
logging.level.org.example.shelfy=DEBUG
logging.level.org.hibernate.SQL=WARN

# Replicate AI Try-on API
replicate.api-url=${REPLICATE_API_URL:https://api.replicate.com/v1/predictions}
replicate.api-token=${REPLICATE_API_TOKEN:}
replicate.model-version=${REPLICATE_MODEL_VERSION:}

app.demo-mode=${APP_DEMO_MODE:true}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend URL / CORS
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

