# ================================================
# SHELFY - APPLICATION CONFIGURATION
# ================================================

spring.application.name=Shelfy

# PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/shelfy_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:ShelfySecretKey2024VeryLongSecretKeyForJWTAt256Bits!!}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_client_secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/calendar

# VNPay Sandbox
vnpay.tmnCode=${VNPAY_TMN_CODE:your_tmn_code}
vnpay.hashSecret=${VNPAY_HASH_SECRET:your_hash_secret}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${APP_BASE_URL:http://localhost:8080}/api/payments/vnpay/callback

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Weather API
weather.api.key=${WEATHER_API_KEY:your_openweather_key}
weather.api.url=https://api.openweathermap.org/data/2.5

# Logging
logging.level.org.example.shelfy=DEBUG
logging.level.org.hibernate.SQL=WARN
